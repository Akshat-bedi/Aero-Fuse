[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airops-dss-backend"
version = "0.1.0"
description = "AirOps DSS backend: fused operational picture, optimiser, retasking and tamper-evident audit for SIH 26250. Fictional data only; runs offline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "ortools==9.15.6755",
  "shapely==2.2.0",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "SQLAlchemy==2.1.5",
  "PyJWT==2.15.1",
  "orjson==3.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.170.2",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "tasks.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
