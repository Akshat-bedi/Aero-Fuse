services:
  api:
    build: .
    container_name: airops-backend
    ports:
      - "8000:8000"
    environment:
      SEED: "42"
      SEED_PATH: "/srv/airops/shared/seed/world.json"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      SIM_START_TIME: "2026-10-17T12:00:00.000Z"
      DB_URL: "sqlite:////srv/airops/data/airops.db"
      RECO_TTL_MIN: "90"
    volumes:
      - ../shared/seed:/srv/airops/shared/seed:ro
      - airops-audit:/srv/airops/data
    restart: unless-stopped

volumes:
  airops-audit:
